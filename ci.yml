name: CI & Retail Sync

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Синхронизация каждый день в 6:00 UTC (9:00 МСК)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Тип синхронизации'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sales
          - balances
          - nomenclature
      days:
        description: 'Период в днях (для sales)'
        required: false
        default: '7'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  sync:
    name: Sync SBIS Retail Data
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      SBIS_CLIENT_ID: ${{ secrets.SBIS_CLIENT_ID }}
      SBIS_APP_SECRET: ${{ secrets.SBIS_APP_SECRET }}
      SBIS_SECRET_KEY: ${{ secrets.SBIS_SECRET_KEY }}
      SBIS_TOKEN: ${{ secrets.SBIS_TOKEN }}
      SBIS_HOST: ${{ secrets.SBIS_HOST || 'api.sbis.ru' }}
      SBIS_POINT_ID: ${{ secrets.SBIS_POINT_ID }}
      SBIS_WAREHOUSE_ID: ${{ secrets.SBIS_WAREHOUSE_ID }}
      SBIS_COMPANY_ID: ${{ secrets.SBIS_COMPANY_ID }}
      SBIS_PRICE_LIST_ID: ${{ secrets.SBIS_PRICE_LIST_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///bar_management.db' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-secret' }}

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy requests pandas python-dotenv

    - name: Run sync
      run: |
        SYNC_TYPE="${{ github.event.inputs.sync_type || 'all' }}"
        DAYS="${{ github.event.inputs.days || '7' }}"

        if [ "$SYNC_TYPE" = "sales" ]; then
          python sync_retail.py --sales --days $DAYS
        elif [ "$SYNC_TYPE" = "balances" ]; then
          python sync_retail.py --balances
        elif [ "$SYNC_TYPE" = "nomenclature" ]; then
          python sync_retail.py --nomenclature
        else
          python sync_retail.py --all --days $DAYS
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sync-results
        path: |
          sync_retail.log
          *.db
          nomenclature_cache.json
        retention-days: 7
